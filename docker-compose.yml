# 生产编排：MySQL 8 + 应用 + Redis（可选）+ Nginx 反代
# 用法：
#   1. 复制 .env.example 为 .env 并填写 MYSQL_PASSWORD / SECRET_KEY / ADMIN_USERNAME / CORS_ORIGINS
#   2. docker compose up -d --build
#   3. 首次启动后访问 http://<服务器IP> 注册管理员（用户名须与 ADMIN_USERNAME 一致）
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me-strong-password}
      MYSQL_DATABASE: bilibili_bangumi
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - ./migrate_add_admin.sql:/docker-entrypoint-initdb.d/10-migrate_add_admin.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-change-me-strong-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["full"]   # 可选：默认不启动，启用缓存时加 --profile full

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-strong-password}
      MYSQL_DATABASE: bilibili_bangumi
      SECRET_KEY: ${SECRET_KEY:?必须设置 SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: ${REDIS_ENABLED:-0}
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - static_cache:/var/cache/nginx

volumes:
  db_data:
  static_cache:
