# nginx 反代配置：Bilibilibs
# 同域部署（浏览器访问 http(s)://域名，API 走同源），无需 CORS。
# HTTPS：将证书放到 deploy/certs/ 下并取消下方 443 server 注释。
#
# 注意：容器内应用代码在 /app，静态文件在 /app/static；下面用一个卷把
# /app/static 挂到 nginx 能读的位置（见 docker-compose.yml 中 web 服务说明），
# 简单起见这里直接代理静态文件到 gunicorn，或改用 docker-compose 中的卷映射。
# 生产建议：在 docker-compose.yml 给 web 加 named volume 或复制静态目录后由 nginx 直出。

server {
    listen 80;
    server_name _;

    # 启用 HTTPS 后打开以下跳转
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # 全部请求交给 gunicorn（静态文件也由 Flask 服务，部署简单可靠）
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
